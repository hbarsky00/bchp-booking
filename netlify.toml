[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing: every route except a real file must serve index.html, or a
# refresh on /search-results 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so they are safe to cache permanently.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    # Served as application/octet-stream by default, which some browsers reject.
    Content-Type = "application/manifest+json; charset=utf-8"
